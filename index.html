<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포스코퓨처엠 안전관리 CBT</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <!-- 상단 바 -->
  <header class="topbar">
    <div class="container">
      <a href="index.html" class="logo" style="text-decoration:none;">📘 POSCO FUTURE M · CBT</a>
      <div class="topbar-actions">
        <span id="user-badge" class="auth-badge" style="display:none;">👤 <span id="user-name">-</span></span>
        <button id="settings-btn" class="btn-sm" title="설정">⚙️</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 히어로 -->
    <section class="hero">
      <h2>포스코퓨처엠 안전관리 CBT</h2>
      <p>실전 대비 문제풀이 · 오답 재도전 · 북마크 학습</p>
    </section>

    <!-- 통계 카드 -->
    <section class="stats-row">
      <div class="stat-card">
        <div class="label">📝 총 응시</div>
        <div class="value" id="stat-sessions">0</div>
      </div>
      <div class="stat-card">
        <div class="label">🎯 평균 점수</div>
        <div class="value" id="stat-avg">0<span style="font-size:1rem;">점</span></div>
      </div>
      <div class="stat-card">
        <div class="label">⭐ 북마크</div>
        <div class="value" id="stat-bookmarks">0</div>
      </div>
    </section>

    <!-- 북마크 모아보기 -->
    <section class="bookmark-section" id="bookmark-section" style="display:none;">
      <h3 style="color:var(--secondary); display:flex; align-items:center; gap:8px;">
        ⭐ 북마크한 문제
        <span id="bookmark-count" style="font-size:0.85rem; color:var(--gray-500); font-weight:400;">(0)</span>
      </h3>
      <div class="bookmark-list" id="bookmark-list"></div>
    </section>

    <!-- 최근 응시 결과 -->
    <section id="recent-section" style="display:none;">
      <h3 class="section-title">📜 최근 응시 결과</h3>
      <div class="exam-grid" id="recent-list"></div>
    </section>

    <!-- ===== 탭: 회차 선택 / 중복기출 ===== -->
    <section>
      <div class="main-tabs">
        <button class="main-tab active" data-tab="rounds" type="button">📅 회차 선택</button>
        <button class="main-tab" data-tab="dup" type="button">🔒 중복기출</button>
      </div>

      <!-- 회차 선택 패널 -->
      <div class="tab-panel" id="panel-rounds">
        <div class="exam-grid" id="exam-list">
          <p class="loading" style="grid-column:1/-1;">회차 목록을 불러오는 중...</p>
        </div>
      </div>

      <!-- 중복기출 패널 -->
      <div class="tab-panel" id="panel-dup" style="display:none;">
        <div class="lock-box" id="dup-locked">
          <div class="lock-icon">🔒</div>
          <p class="lock-text">중복기출은 <b>입장코드</b>를 입력해야 이용할 수 있습니다.</p>
          <button id="open-code-btn" class="btn-primary" type="button">입장코드 입력</button>
        </div>
        <div class="exam-grid" id="dup-list" style="display:none;"></div>
      </div>
    </section>
  </main>

  <!-- 입장코드 모달 -->
  <div class="auth-modal-bg" id="code-modal">
    <div class="auth-modal">
      <h3>🔐 중복기출 입장코드</h3>
      <input type="password" id="code-input" placeholder="입장코드를 입력하세요" autocomplete="off">
      <div class="code-error" id="code-error" style="display:none;">입장코드가 올바르지 않습니다.</div>
      <div class="actions">
        <button id="code-submit-btn" class="btn-primary" type="button">입장</button>
        <button id="code-cancel-btn" class="btn" type="button">취소</button>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="auth-modal-bg" id="settings-modal">
    <div class="auth-modal">
      <h3>⚙️ 설정</h3>
      <div style="margin-bottom:20px; color:var(--gray-600); font-size:0.9rem; line-height:1.7;">
        모든 데이터(응시 기록, 북마크)를 초기화합니다.<br>
        이 작업은 되돌릴 수 없습니다.
      </div>
      <div class="actions">
        <button id="clear-data-btn" class="btn-danger" type="button">🗑️ 전체 데이터 초기화</button>
        <button id="close-settings-btn" class="btn" type="button">닫기</button>
      </div>
    </div>
  </div>

  <script src="js/protect.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
