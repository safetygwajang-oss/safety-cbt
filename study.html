  <!-- ===== Google AdSense 로더 (페이지당 1회) ===== -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9283463208175336"
     crossorigin="anonymous"></script>

  <!-- ⬇️ 보호 스크립트를 head에서 먼저 로드 (초기 우클릭까지 차단) -->
  <script src="js/protect.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/custom.css">

  <style>
    html, body { min-height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    body > main { flex: 1 0 auto; }

    .ad-zone { display: block; margin: 26px auto 10px; max-width: 100%; overflow: hidden; text-align: center; }
    .ad-zone .adsbygoogle { display: block; width: 100%; }
    .ad-label { display: block; font-size: 0.62rem; color: #c2c8ce; letter-spacing: 0.06em; margin-bottom: 4px; text-align: center; }

    .site-footer {
      flex-shrink: 0; margin-top: auto; padding: 18px 12px 22px;
      text-align: center; font-size: 0.72rem; line-height: 1.6;
      color: #9aa1ab; border-top: 1px solid var(--gray-200, #e5e7eb);
      background: #fff; word-break: keep-all;
    }
    .site-footer .footer-links { margin-bottom: 6px; }
    .site-footer .footer-links a { color: #9aa1ab; text-decoration: none; margin: 0 6px; }
    .site-footer .footer-links a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .ad-zone { margin: 18px auto 6px; }
      .site-footer { font-size: 0.68rem; padding: 16px 14px 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a href="index.html" class="logo" style="text-decoration:none;">⛑️ 안전과장 · CBT</a>
      <div class="topbar-actions">
        <a href="index.html#toeic" class="btn-sm" style="text-decoration:none;">🗣️ 토익 목록</a>
        <a href="index.html" class="btn-sm" style="text-decoration:none;">🏠 홈</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="study-head" class="study-head">
      <p class="loading">자료를 불러오는 중...</p>
    </div>

    <!-- ===== 애드센스 광고 1 (상단) ===== -->
    <div class="ad-zone">
      <span class="ad-label">ADVERTISEMENT</span>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-9283463208175336"
           data-ad-slot="1373941745"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <!-- 본문 (섹션 사이 인라인 광고 자동 삽입) -->
    <div id="study-body"></div>

    <div class="study-nav" id="study-nav"></div>

    <!-- ===== 애드센스 광고 2 (하단) ===== -->
    <div class="ad-zone">
      <span class="ad-label">ADVERTISEMENT</span>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-9283463208175336"
           data-ad-slot="8589448751"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="privacy.html">개인정보처리방침</a>·<a href="index.html">홈</a>
    </div>
    · 기출문제 출처 : 시계토끼 제니쌤, 제이크 토익스피킹, 한국산업인력공단, 각종 CBT 사이트(최강 자격증 기출문제 전자문제집 CBT, CBT 문제은행, 모두CBT 등)
  </footer>

  <!-- 인라인 광고 스크립트 (렌더링 스크립트보다 먼저) -->
  <script src="js/inline-ads.js"></script>

<script>
(function () {
  var PARTS = ['toeic-part1','toeic-part2','toeic-part3','toeic-part4','toeic-part5'];
  var LABEL = {
    'toeic-part1':'PART 1 문장읽기',
    'toeic-part2':'PART 2 사진묘사',
    'toeic-part3':'PART 3 질문답변',
    'toeic-part4':'PART 4 정보활용',
    'toeic-part5':'PART 5 의견제시'
  };

  var id = new URLSearchParams(location.search).get('id') || 'toeic-part1';

  var esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  };

  fetch('data/' + id + '.json')
    .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(render)
    .catch(function () {
      document.getElementById('study-head').innerHTML =
        '<p class="loading">자료를 불러올 수 없습니다. (data/' + esc(id) + '.json)</p>';
    });

  function render(d) {
    /* ── 헤더 ── */
    var h = '<div class="study-badge">' + esc(d.badge || 'TOEIC Speaking') + '</div>' +
            '<h2 class="study-title">' + esc(d.title) + '</h2>';
    if (d.subtitle) h += '<p class="study-sub">' + esc(d.subtitle) + '</p>';

    if (d.meta && d.meta.length) {
      h += '<div class="study-meta">';
      d.meta.forEach(function (m) {
        h += '<span><b>' + esc(m.k) + '</b> ' + esc(m.v) + '</span>';
      });
      h += '</div>';
    }

    if (d.sections && d.sections.length) {
      h += '<div class="study-toc"><b>목차</b><ul>';
      d.sections.forEach(function (s, i) {
        h += '<li><a href="#sec' + i + '">' + esc(s.title) + '</a></li>';
      });
      h += '</ul></div>';
    }

    document.getElementById('study-head').innerHTML = h;
    document.title = d.title + ' · 안전과장 CBT';

    /* ── 본문 ── */
    var b = '';
    (d.sections || []).forEach(function (s, i) {
      b += '<section class="study-sec" id="sec' + i + '">';
      b += '<h3>' + esc(s.title) + '</h3>';
      if (s.note) b += '<p class="sec-note">' + esc(s.note) + '</p>';

      if (s.bullets) {
        b += '<ul class="sec-bullets">';
        s.bullets.forEach(function (t) { b += '<li>' + esc(t) + '</li>'; });
        b += '</ul>';
      }

      if (s.table) {
        b += '<div class="sec-table-wrap"><table class="sec-table"><thead><tr>';
        s.table.head.forEach(function (t) { b += '<th>' + esc(t) + '</th>'; });
        b += '</tr></thead><tbody>';
        s.table.rows.forEach(function (row) {
          b += '<tr>';
          row.forEach(function (c) { b += '<td>' + esc(c) + '</td>'; });
          b += '</tr>';
        });
        b += '</tbody></table></div>';
      }

      if (s.phrases) {
        b += '<div class="phrase-list">';
        s.phrases.forEach(function (p) {
          b += '<div class="phrase">' +
               '<div class="ph-en">' + esc(p.en) + '</div>' +
               '<div class="ph-ko">' + esc(p.ko) + '</div>' +
               (p.tip ? '<div class="ph-tip">💡 ' + esc(p.tip) + '</div>' : '') +
               '</div>';
        });
        b += '</div>';
      }

      if (s.tip) b += '<div class="sec-tip">✅ ' + esc(s.tip) + '</div>';
      if (s.warn) b += '<div class="sec-warn">⚠️ ' + esc(s.warn) + '</div>';
      b += '</section>';
    });
    document.getElementById('study-body').innerHTML = b;

    /* ── 섹션 사이 인라인 광고 (3개마다, 최대 3개) ── */
    if (window.InlineAds) {
      setTimeout(function () {
        try { InlineAds.inject('#study-body > .study-sec', 3, 3); } catch (e) {}
      }, 0);
    }

    /* ── 이전/다음 파트 ── */
    var idx = PARTS.indexOf(id), nav = '';
    if (idx > 0) {
      nav += '<a class="btn" href="study.html?id=' + PARTS[idx-1] + '">← ' + LABEL[PARTS[idx-1]] + '</a>';
    }
    nav += '<a class="btn" href="index.html#toeic">목록</a>';
    if (idx > -1 && idx < PARTS.length - 1) {
      nav += '<a class="btn-primary" href="study.html?id=' + PARTS[idx+1] + '">' + LABEL[PARTS[idx+1]] + ' →</a>';
    }
    document.getElementById('study-nav').innerHTML = nav;

    /* ── 목차 클릭 시 부드러운 이동 ── */
    document.querySelectorAll('.study-toc a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var t = document.querySelector(this.getAttribute('href'));
        if (!t) return;
        e.preventDefault();
        window.scrollTo({ top: t.getBoundingClientRect().top + window.pageYOffset - 70, behavior: 'smooth' });
      });
    });
  }
})();
</script>

  <!-- ⬇️ 보호 스크립트 (head에 넣었다면 중복 가드로 무시됨 — 둘 다 둬도 안전) -->
  <script src="js/protect.js"></script>
</body>
</html>
