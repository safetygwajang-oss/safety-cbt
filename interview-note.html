<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>면접 예상질문 & 나의 답변 노트</title>
  <meta name="description" content="기업별 면접 예상질문에 나의 답변을 작성하고 저장·내보내기 하는 개인 학습 노트" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <h1><a href="index.html">📖 면접 예상질문 노트</a></h1>

    <div class="topbar-actions">
      <input id="search" type="search" placeholder="질문·태그 검색 (예: PSM, 이직사유)" />
      <button id="btn-export" class="btn" type="button">내 답변 내보내기(JSON)</button>
      <label class="btn ghost">
        불러오기<input id="file-import" type="file" accept="application/json" hidden />
      </label>
      <button id="btn-print" class="btn ghost" type="button">인쇄/PDF</button>
      <a href="interview.html" class="btn ghost">면접 가이드</a>
      <a href="index.html" class="btn ghost">🏠 홈</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <select id="filter-tier">
          <option value="">전체 기업군</option>
        </select>
        <select id="filter-type">
          <option value="">전체 질문유형</option>
        </select>
        <label class="chk"><input type="checkbox" id="only-unanswered" /> 미작성만 보기</label>
      </div>
      <nav id="nav" class="nav"></nav>
    </aside>

    <main id="main" class="main">
      <p class="loading">데이터를 불러오는 중…</p>
    </main>
  </div>

  <div id="toast" class="toast" hidden>저장됨</div>

  <script src="assets/app.js"></script>

  <!-- ▼▼▼ [추가] 답변 자동저장 + JSON 내보내기/불러오기 연동 패치 (원본 로직은 그대로 유지) ▼▼▼ -->
  <script>
  (function () {
    "use strict";

    /* ===== 설정 ===== */
    var MY_KEY   = "interview-note:answers:v1"; // 이 패치의 저장소
    var SCHEMA   = "interview-note-answers";    // 내보내기 파일 식별자
    var VERSION  = 1;
    var DEBOUNCE = 400;                          // 자동저장 지연(ms)
    var APPLY_WINDOW = 15000;                    // 늦게 렌더되는 질문에 값 주입 대기(ms)

    /* ===== 공통 유틸 ===== */
    function $(sel, root) { return (root || document).querySelector(sel); }
    var toastEl = $("#toast"), toastTimer = null;
    function toast(msg) {
      if (!toastEl) { console.log("[note]", msg); return; }
      toastEl.textContent = msg;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2000);
    }
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

    /* ===== 1) 답변 textarea 식별 =====
       data-qid / data-id / data-key / name / id 중 아무거나 있으면 답변칸으로 인식 */
    function keyOf(ta) {
      var d = ta.dataset || {};
      return d.qid || d.qId || d.id || d.key || d.question || ta.name || ta.id || null;
    }
    function answerAreas() {
      var out = [], list = document.querySelectorAll("textarea"), i, k;
      for (i = 0; i < list.length; i++) {
        k = keyOf(list[i]);
        if (k) out.push({ el: list[i], key: String(k) });
      }
      return out;
    }
    function domAnswers() {
      var m = {}, a = answerAreas(), i;
      for (i = 0; i < a.length; i++) {
        var v = a[i].el.value;
        if (v != null && String(v).trim() !== "") m[a[i].key] = String(v);
      }
      return m;
    }

    /* ===== 2) app.js가 쓰는 저장소 자동 탐지(있다면 미러링) ===== */
    function looksLikeAnswerStore(obj) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) return false;
      var ks = Object.keys(obj), i, hit = 0;
      if (!ks.length || ks.length > 5000) return false;
      for (i = 0; i < ks.length; i++) {
        var v = obj[ks[i]];
        if (typeof v === "string") hit++;
        else if (v && typeof v === "object" &&
                (typeof v.answer === "string" || typeof v.text === "string" || typeof v.value === "string")) hit++;
      }
      return hit === ks.length;
    }
    function detectStores() {
      var found = [], i, k, raw, obj;
      try {
        for (i = 0; i < localStorage.length; i++) {
          k = localStorage.key(i);
          if (!k || k === MY_KEY) continue;
          if (!/answer|note|interview|질문|답변/i.test(k)) continue;
          raw = lsGet(k);
          if (!raw || raw.charAt(0) !== "{") continue;
          try { obj = JSON.parse(raw); } catch (e) { continue; }
          if (looksLikeAnswerStore(obj)) found.push({ key: k, sample: obj });
          else if (obj && looksLikeAnswerStore(obj.answers)) found.push({ key: k, sample: obj.answers, wrap: "answers" });
        }
      } catch (e) {}
      return found;
    }

    /* ===== 3) 저장 ===== */
    function loadMine() {
      try {
        var o = JSON.parse(lsGet(MY_KEY) || "{}");
        return (o && o.answers) ? o.answers : (looksLikeAnswerStore(o) ? o : {});
      } catch (e) { return {}; }
    }
    function saveMine(map) {
      return lsSet(MY_KEY, JSON.stringify({
        schema: SCHEMA, version: VERSION, savedAt: new Date().toISOString(), answers: map
      }));
    }
    function mirrorToStores(map) {
      var stores = detectStores(), i, s, cur, ks, j, key;
      for (i = 0; i < stores.length; i++) {
        s = stores[i];
        try {
          cur = JSON.parse(lsGet(s.key) || "{}");
          var target = s.wrap ? (cur.answers || (cur.answers = {})) : cur;
          ks = Object.keys(map);
          for (j = 0; j < ks.length; j++) {
            key = ks[j];
            var old = target[key];
            if (old && typeof old === "object") {
              if (typeof old.answer === "string") old.answer = map[key];
              else if (typeof old.text === "string") old.text = map[key];
              else old.value = map[key];
            } else {
              target[key] = map[key];
            }
          }
          lsSet(s.key, JSON.stringify(cur));
        } catch (e) {}
      }
    }
    function mergedAnswers() {
      var base = loadMine(), dom = domAnswers(), ks = Object.keys(dom), i;
      for (i = 0; i < ks.length; i++) base[ks[i]] = dom[ks[i]];
      var stores = detectStores(), s, j, sk, v;
      for (i = 0; i < stores.length; i++) {
        s = stores[i]; sk = Object.keys(s.sample);
        for (j = 0; j < sk.length; j++) {
          if (base[sk[j]] != null && String(base[sk[j]]).trim() !== "") continue;
          v = s.sample[sk[j]];
          v = (typeof v === "string") ? v : (v && (v.answer || v.text || v.value)) || "";
          if (String(v).trim() !== "") base[sk[j]] = String(v);
        }
      }
      return base;
    }

    var saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { flushSave(true); }, DEBOUNCE);
    }
    function flushSave(showToast) {
      var map = mergedAnswers();
      var ok = saveMine(map);
      mirrorToStores(domAnswers());
      if (showToast) toast(ok ? "저장됨 (" + Object.keys(map).length + "문항)" : "⚠ 저장 실패(브라우저 저장공간 확인)");
    }

    document.addEventListener("input", function (e) {
      if (e.target && e.target.tagName === "TEXTAREA" && keyOf(e.target)) scheduleSave();
    }, false);
    window.addEventListener("beforeunload", function () { flushSave(false); });

    /* ===== 4) 화면에 값 주입 (비동기 렌더 대응) ===== */
    var pending = null, pendingOnlyEmpty = true, pendingUntil = 0, observer = null;

    function setValue(ta, text) {
      if (ta.value === text) return;
      ta.value = text;
      ta.dispatchEvent(new Event("input", { bubbles: true }));
      ta.dispatchEvent(new Event("change", { bubbles: true }));
    }
    function applyPending() {
      if (!pending) return 0;
      var a = answerAreas(), i, n = 0;
      for (i = 0; i < a.length; i++) {
        var v = pending[a[i].key];
        if (v == null) continue;
        if (pendingOnlyEmpty && String(a[i].el.value || "").trim() !== "") continue;
        setValue(a[i].el, String(v)); n++;
      }
      return n;
    }
    function startApply(map, onlyEmpty) {
      pending = map; pendingOnlyEmpty = !!onlyEmpty;
      pendingUntil = Date.now() + APPLY_WINDOW;
      var n = applyPending();
      if (!observer) {
        observer = new MutationObserver(function () {
          if (Date.now() > pendingUntil) { observer.disconnect(); observer = null; pending = null; return; }
          applyPending();
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }
      return n;
    }

    /* 새로고침 복원: 이미 값이 있는 칸은 건드리지 않음 */
    function restore() {
      var mine = loadMine();
      if (Object.keys(mine).length) startApply(mine, true);
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", restore);
    } else { restore(); }

    /* ===== 5) 내보내기 ===== */
    function stamp() {
      var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
             "_" + p(d.getHours()) + p(d.getMinutes());
    }
    function doExport() {
      flushSave(false);
      var answers = mergedAnswers();
      var payload = {
        schema: SCHEMA,
        version: VERSION,
        app: "면접 예상질문 노트",
        exportedAt: new Date().toISOString(),
        count: Object.keys(answers).length,
        answers: answers
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "면접답변_" + stamp() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast("내보내기 완료 · " + payload.count + "문항");
    }

    /* ===== 6) 불러오기 (구버전 포맷 5종 호환) ===== */
    function normalize(data) {
      var map = {}, i, it, k;
      function put(key, val) {
        if (key == null) return;
        if (val && typeof val === "object") val = val.answer || val.text || val.value || "";
        if (val == null) return;
        val = String(val);
        if (val.trim() === "") return;
        map[String(key)] = val;
      }
      if (Array.isArray(data)) {                                   // [{qid, answer}, ...]
        for (i = 0; i < data.length; i++) {
          it = data[i] || {};
          put(it.qid || it.id || it.key || it.question || it.q, it.answer || it.text || it.value || it.a);
        }
        return map;
      }
      if (data && typeof data === "object") {
        var src = data.answers || data.data || data.notes || data.items || data;
        if (Array.isArray(src)) return normalize(src);
        var ks = Object.keys(src);
        for (i = 0; i < ks.length; i++) { k = ks[i]; put(k, src[k]); }
      }
      return map;
    }

    function doImport(file) {
      if (!file) return;
      var fr = new FileReader();
      fr.onload = function () {
        var data;
        try { data = JSON.parse(String(fr.result)); }
        catch (e) { toast("⚠ JSON 형식이 아닙니다"); return; }

        var incoming = normalize(data), n = Object.keys(incoming).length;
        if (!n) { toast("⚠ 불러올 답변이 없습니다(파일 구조 확인)"); return; }

        var overwrite = confirm(
          "불러올 답변 " + n + "문항.\n\n[확인] 기존 답변에 덮어쓰기\n[취소] 병합(비어 있는 칸만 채우기)"
        );

        var current = mergedAnswers(), ks = Object.keys(incoming), i, k;
        for (i = 0; i < ks.length; i++) {
          k = ks[i];
          if (!overwrite && current[k] != null && String(current[k]).trim() !== "") continue;
          current[k] = incoming[k];
        }
        saveMine(current);
        mirrorToStores(current);

        var applied = startApply(current, !overwrite);
        toast("불러오기 완료 · " + n + "문항 (화면 반영 " + applied + "개)");

        if (applied === 0) {
          if (confirm("저장은 완료되었으나 화면 반영이 확인되지 않았습니다.\n새로고침해서 반영할까요?")) location.reload();
        }
      };
      fr.onerror = function () { toast("⚠ 파일을 읽을 수 없습니다"); };
      fr.readAsText(file, "utf-8");
    }

    /* ===== 7) 원본 버튼에 연결 (캡처 단계에서 선점 → 이중 실행 방지) ===== */
    function bind() {
      var btn = $("#btn-export"), fi = $("#file-import");
      if (btn && !btn.dataset.patched) {
        btn.dataset.patched = "1";
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          doExport();
        }, true);
      }
      if (fi && !fi.dataset.patched) {
        fi.dataset.patched = "1";
        fi.addEventListener("change", function (e) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          var f = fi.files && fi.files[0];
          doImport(f);
          fi.value = ""; // 같은 파일 재선택 가능
        }, true);
      }
      // Ctrl/Cmd + S = 즉시 저장
      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
          e.preventDefault(); flushSave(true);
        }
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
    else bind();
  })();
  </script>
  <!-- ▲▲▲ [추가] 패치 끝 ▲▲▲ -->
</body>
</html>
