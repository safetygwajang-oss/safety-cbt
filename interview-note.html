<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>면접 예상질문 & 나의 답변 노트</title>

  <meta
    name="description"
    content="기업별 면접 예상질문에 나의 답변을 작성하고 저장하는 개인 학습 노트"
  />

  <link rel="stylesheet" href="assets/style.css" />

  <style>
    /*
     * 우측 상단 저장 안내 문구
     * 배경색이나 음영 없이 글자만 표시합니다.
     */
    .save-notice {
      display: inline-flex;
      align-items: center;
      margin-left: auto;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
    }

    /*
     * 화면이 좁아질 경우 문구가 잘리지 않도록 줄바꿈을 허용합니다.
     */
    @media (max-width: 1100px) {
      .save-notice {
        width: 100%;
        margin-left: 0;
        white-space: normal;
      }
    }

    /*
     * 인쇄할 때는 화면용 안내 문구를 표시하지 않습니다.
     */
    @media print {
      .save-notice {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>
      <a href="index.html">📖 면접 예상질문 노트</a>
    </h1>

    <div class="topbar-actions">
      <input
        id="search"
        type="search"
        placeholder="질문·태그 검색 (예: PSM, 이직사유)"
      />

      <span class="save-notice">
        ※ 내용이 포맷될 수 있으니 따로 저장해 두시기 바랍니다.
      </span>

      <button id="btn-print" class="btn ghost" type="button">
        인쇄/PDF
      </button>

      <a href="interview.html" class="btn ghost">
        면접 가이드
      </a>

      <a href="index.html" class="btn ghost">
        🏠 홈
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <select id="filter-tier">
          <option value="">전체 기업군</option>
        </select>

        <select id="filter-type">
          <option value="">전체 질문유형</option>
        </select>

        <label class="chk">
          <input type="checkbox" id="only-unanswered" />
          미작성만 보기
        </label>
      </div>

      <nav id="nav" class="nav"></nav>
    </aside>

    <main id="main" class="main">
      <p class="loading">데이터를 불러오는 중…</p>
    </main>
  </div>

  <div id="toast" class="toast" hidden>
    저장됨
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
