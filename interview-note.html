<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>면접 예상질문 & 나의 답변 노트</title>

  <meta
    name="description"
    content="기업별 면접 예상질문에 나의 답변을 작성하고 저장하는 개인 학습 노트"
  />

  <link rel="stylesheet" href="assets/style.css" />

  <style>
    /*
     * [보안] 입력창(input, textarea)을 제외한 전체 영역 드래그/선택 금지
     */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /*
     * 핵심 키워드, 답변 입력란 등 사용자가 직접 입력하는 요소만 복사/드래그 허용
     */
    input,
    textarea,
    [contenteditable="true"],
    .allow-copy {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    /*
     * 우측 상단 저장 안내 문구
     */
    .save-notice {
      display: inline-flex;
      align-items: center;
      margin-left: auto;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      .save-notice {
        width: 100%;
        margin-left: 0;
        white-space: normal;
      }
    }

    @media print {
      .save-notice {
        display: none;
      }
    }

    /*
     * app.js 호환용 숨김 슬롯
     */
    .legacy-hidden-slot {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      clip-path: inset(50%) !important;
      white-space: nowrap !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>
      <a href="index.html">📖 면접 예상질문 노트</a>
    </h1>

    <div class="topbar-actions">
      <input
        id="search"
        type="search"
        placeholder="질문·태그 검색 (예: PSM, 이직사유)"
      />

      <span class="save-notice">
        ※ 내용이 포맷될 수 있으니 따로 저장해 두시기 바랍니다.
      </span>

      <button id="btn-print" class="btn ghost" type="button">
        인쇄/PDF
      </button>

      <a href="interview.html" class="btn ghost">
        면접 가이드
      </a>

      <a href="index.html" class="btn ghost">
        🏠 홈
      </a>
    </div>
  </header>

  <!--
    app.js 호환용 숨김 슬롯
  -->
  <div class="legacy-hidden-slot" aria-hidden="true">
    <button id="btn-export" type="button" tabindex="-1">
      내보내기
    </button>

    <button id="btn-import" type="button" tabindex="-1">
      불러오기
    </button>

    <button id="btn-export-word" type="button" tabindex="-1">
      Word
    </button>

    <input
      id="file-import"
      type="file"
      accept="application/json,.json"
      tabindex="-1"
    />
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <select id="filter-tier">
          <option value="">전체 기업군</option>
        </select>

        <select id="filter-type">
          <option value="">전체 질문유형</option>
        </select>

        <label class="chk">
          <input type="checkbox" id="only-unanswered" />
          미작성만 보기
        </label>
      </div>

      <nav id="nav" class="nav"></nav>
    </aside>

    <main id="main" class="main">
      <p class="loading">데이터를 불러오는 중…</p>
    </main>
  </div>

  <div id="toast" class="toast" hidden>
    저장됨
  </div>

  <!-- ▼▼▼ [추가] 콘텐츠 보호 스크립트 (입력창 외 우클릭/복사 차단) ▼▼▼ -->
  <script>
  (function () {
    "use strict";

    /* 입력 요소인지 판단하는 함수 (키워드/답변 작성란 허용) */
    function isEditableElement(el) {
      if (!el) return false;
      var tagName = el.tagName ? el.tagName.toUpperCase() : "";
      if (tagName === "TEXTAREA" || tagName === "INPUT") return true;
      if (el.isContentEditable) return true;
      if (el.closest && el.closest(".allow-copy")) return true;
      return false;
    }

    /* 1. 마우스 우클릭 제한 (입력란 내부만 허용) */
    document.addEventListener("contextmenu", function (e) {
      if (!isEditableElement(e.target)) {
        e.preventDefault();
        return false;
      }
    }, true);

    /* 2. 복사(Copy) / 잘라내기(Cut) 제한 */
    document.addEventListener("copy", function (e) {
      if (!isEditableElement(e.target)) {
        e.preventDefault();
        return false;
      }
    }, true);

    document.addEventListener("cut", function (e) {
      if (!isEditableElement(e.target)) {
        e.preventDefault();
        return false;
      }
    }, true);

    /* 3. 드래그 시작 제한 */
    document.addEventListener("dragstart", function (e) {
      if (!isEditableElement(e.target)) {
        e.preventDefault();
        return false;
      }
    }, true);

    /* 4. 선택(selection) 영역 시작 제한 */
    document.addEventListener("selectstart", function (e) {
      if (!isEditableElement(e.target)) {
        e.preventDefault();
        return false;
      }
    }, true);
  })();
  </script>
  <!-- ▲▲▲ 콘텐츠 보호 스크립트 끝 ▲▲▲ -->

  <!--
    안전장치
    app.js가 참조하는 요소 미존재 시 임시 요소 생성
  -->
  <script>
  (function () {
    "use strict";

    var SAFE_IDS = [
      "btn-export",
      "btn-import",
      "btn-export-word",
      "btn-export-json",
      "btn-save",
      "btn-reset",
      "btn-clear",
      "file-import",
      "file-input"
    ];

    function slot() {
      var container = document.querySelector(".legacy-hidden-slot");
      if (!container) {
        container = document.createElement("div");
        container.className = "legacy-hidden-slot";
        container.setAttribute("aria-hidden", "true");
        document.body.appendChild(container);
      }
      return container;
    }

    function createStub(id) {
      var element;
      if (id.indexOf("file") !== -1) {
        element = document.createElement("input");
        element.type = "file";
      } else {
        element = document.createElement("button");
        element.type = "button";
      }
      element.id = id;
      element.tabIndex = -1;
      slot().appendChild(element);
      return element;
    }

    var originalGetElementById = document.getElementById.bind(document);

    document.getElementById = function (id) {
      var found = originalGetElementById(id);
      if (found || SAFE_IDS.indexOf(id) === -1) {
        return found;
      }
      return createStub(id);
    };

    var originalQuerySelector = document.querySelector.bind(document);

    document.querySelector = function (selector) {
      var found = originalQuerySelector(selector);
      if (found) {
        return found;
      }

      if (typeof selector === "string" && /^#[A-Za-z][\w-]*$/.test(selector)) {
        var id = selector.slice(1);
        if (SAFE_IDS.indexOf(id) !== -1) {
          return createStub(id);
        }
      }

      return found;
    };
  })();
  </script>

  <script src="assets/app.js"></script>
</body>
</html>
