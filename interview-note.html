<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>면접 예상질문 & 나의 답변 노트</title>

  <meta
    name="description"
    content="기업별 면접 예상질문에 나의 답변을 작성하고 저장하는 개인 학습 노트"
  />

  <link rel="stylesheet" href="assets/style.css" />

  <style>
    /*
     * 우측 상단 저장 안내 문구
     * 배경색이나 음영 없이 글자만 표시합니다.
     */
    .save-notice {
      display: inline-flex;
      align-items: center;
      margin-left: auto;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      .save-notice {
        width: 100%;
        margin-left: 0;
        white-space: normal;
      }
    }

    @media print {
      .save-notice {
        display: none;
      }
    }

    /*
     * app.js가 참조하는 요소를 화면에서만 숨깁니다.
     * 요소 자체는 존재하므로 초기화 오류가 발생하지 않습니다.
     */
    .legacy-hidden-slot {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      clip-path: inset(50%) !important;
      white-space: nowrap !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>
      <a href="index.html">📖 면접 예상질문 노트</a>
    </h1>

    <div class="topbar-actions">
      <input
        id="search"
        type="search"
        placeholder="질문·태그 검색 (예: PSM, 이직사유)"
      />

      <span class="save-notice">
        ※ 내용이 포맷될 수 있으니 따로 저장해 두시기 바랍니다.
      </span>

      <button id="btn-print" class="btn ghost" type="button">
        인쇄/PDF
      </button>

      <a href="interview.html" class="btn ghost">
        면접 가이드
      </a>

      <a href="index.html" class="btn ghost">
        🏠 홈
      </a>
    </div>
  </header>

  <!--
    app.js 호환용 숨김 슬롯
    화면에는 보이지 않으며 초기화 오류 방지 목적으로만 존재합니다.
  -->
  <div class="legacy-hidden-slot" aria-hidden="true">
    <button id="btn-export" type="button" tabindex="-1">
      내보내기
    </button>

    <button id="btn-import" type="button" tabindex="-1">
      불러오기
    </button>

    <button id="btn-export-word" type="button" tabindex="-1">
      Word
    </button>

    <input
      id="file-import"
      type="file"
      accept="application/json,.json"
      tabindex="-1"
    />
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <select id="filter-tier">
          <option value="">전체 기업군</option>
        </select>

        <select id="filter-type">
          <option value="">전체 질문유형</option>
        </select>

        <label class="chk">
          <input type="checkbox" id="only-unanswered" />
          미작성만 보기
        </label>
      </div>

      <nav id="nav" class="nav"></nav>
    </aside>

    <main id="main" class="main">
      <p class="loading">데이터를 불러오는 중…</p>
    </main>
  </div>

  <div id="toast" class="toast" hidden>
    저장됨
  </div>

  <!--
    안전장치
    app.js가 위 목록 외의 다른 ID를 참조해 초기화 오류가 날 경우를 대비합니다.
    존재하지 않는 요소를 요청하면 숨김 슬롯에 임시 요소를 만들어 반환합니다.
  -->
  <script>
  (function () {
    "use strict";

    /*
     * app.js에서 사용할 가능성이 있는 컨트롤 ID 목록입니다.
     * 필요에 따라 자유롭게 추가할 수 있습니다.
     */
    var SAFE_IDS = [
      "btn-export",
      "btn-import",
      "btn-export-word",
      "btn-export-json",
      "btn-save",
      "btn-reset",
      "btn-clear",
      "file-import",
      "file-input"
    ];

    function slot() {
      var container = document.querySelector(
        ".legacy-hidden-slot"
      );

      if (!container) {
        container = document.createElement("div");
        container.className = "legacy-hidden-slot";
        container.setAttribute("aria-hidden", "true");
        document.body.appendChild(container);
      }

      return container;
    }

    function createStub(id) {
      var element;

      if (
        id.indexOf("file") !== -1
      ) {
        element = document.createElement("input");
        element.type = "file";
      } else {
        element = document.createElement("button");
        element.type = "button";
      }

      element.id = id;
      element.tabIndex = -1;

      slot().appendChild(element);

      return element;
    }

    var originalGetElementById =
      document.getElementById.bind(document);

    document.getElementById = function (id) {
      var found = originalGetElementById(id);

      if (
        found ||
        SAFE_IDS.indexOf(id) === -1
      ) {
        return found;
      }

      return createStub(id);
    };

    var originalQuerySelector =
      document.querySelector.bind(document);

    document.querySelector = function (selector) {
      var found = originalQuerySelector(selector);

      if (found) {
        return found;
      }

      /*
       * "#id" 형태의 단순 선택자만 보완합니다.
       */
      if (
        typeof selector === "string" &&
        /^#[A-Za-z][\w-]*$/.test(selector)
      ) {
        var id = selector.slice(1);

        if (SAFE_IDS.indexOf(id) !== -1) {
          return createStub(id);
        }
      }

      return found;
    };
  })();
  </script>

  <script src="assets/app.js"></script>
</body>
</html>
