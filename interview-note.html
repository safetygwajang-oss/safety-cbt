<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>면접 예상질문 & 나의 답변 노트</title>
  <meta name="description" content="기업별 면접 예상질문에 나의 답변을 작성하고 저장·내보내기 하는 개인 학습 노트" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <h1><a href="index.html">📖 면접 예상질문 노트</a></h1>

    <div class="topbar-actions">
      <input id="search" type="search" placeholder="질문·태그 검색 (예: PSM, 이직사유)" />
      <button id="btn-export" class="btn" type="button">내 답변 내보내기(JSON)</button>
      <label class="btn ghost">
        불러오기<input id="file-import" type="file" accept="application/json" hidden />
      </label>
      <button id="btn-print" class="btn ghost" type="button">인쇄/PDF</button>
      <a href="interview.html" class="btn ghost">면접 가이드</a>
      <a href="index.html" class="btn ghost">🏠 홈</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="filters">
        <select id="filter-tier">
          <option value="">전체 기업군</option>
        </select>
        <select id="filter-type">
          <option value="">전체 질문유형</option>
        </select>
        <label class="chk"><input type="checkbox" id="only-unanswered" /> 미작성만 보기</label>
      </div>
      <nav id="nav" class="nav"></nav>
    </aside>

    <main id="main" class="main">
      <p class="loading">데이터를 불러오는 중…</p>
    </main>
  </div>

  <div id="toast" class="toast" hidden>저장됨</div>

  <script src="assets/app.js"></script>

  <!-- ▼▼▼ [추가] 답변 자동저장 + JSON 내보내기/불러오기 연동 패치 v2 (원본 로직 유지) ▼▼▼ -->
  <script>
  (function () {
    "use strict";

    /* ================= 설정 ================= */
    var MY_KEY = "interview-note:answers:v2";
    var OLD_KEY = "interview-note:answers:v1";
    var SCHEMA = "interview-note-answers";
    var VERSION = 2;
    var DEBOUNCE = 400;
    var APPLY_WINDOW = 20000;

    /* ================= 유틸 ================= */
    function $(s, r) { return (r || document).querySelector(s); }
    var toastEl = $("#toast"), toastTimer = null;
    function toast(m) {
      if (!toastEl) { console.log("[note]", m); return; }
      toastEl.textContent = m; toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
    }
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
    function hash(s) {
      var h = 5381, i;
      s = String(s);
      for (i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h |= 0; }
      return (h >>> 0).toString(36);
    }
    function normText(s) {
      return String(s == null ? "" : s)
        .replace(/\s+/g, " ")
        .replace(/^[\s\-•·]*[0-9]{1,3}[.)\]
]\s*/, "")
        .trim();
    }

    /* ========== 1) 질문 문구 추출 ========== */
    var Q_SELS = "[data-question],.question,.q,.q-title,.qtext,.q-text,h2,h3,h4,h5,legend,summary,label,strong,b,p";
    function questionTextFor(ta) {
      var node = ta, lvl = 0, i, t, dq;
      while (node && lvl < 7) {
        node = node.parentElement; lvl++;
        if (!node) break;
        if (node.dataset) {
          dq = node.dataset.question || node.dataset.q || node.dataset.title;
          if (dq && normText(dq).length > 3) return normText(dq);
        }
        var cands = node.querySelectorAll(Q_SELS);
        for (i = 0; i < cands.length; i++) {
          if (cands[i].contains(ta)) continue;
          t = normText(cands[i].textContent);
          if (t.length >= 6 && t.length <= 400) return t;
        }
      }
      return normText(ta.getAttribute("aria-label") || ta.getAttribute("placeholder") || "");
    }

    /* ========== 2) 키 결정 (4단 폴백) ========== */
    function allTextareas() { return Array.prototype.slice.call(document.querySelectorAll("textarea")); }
    function indexOfTa(ta) { return allTextareas().indexOf(ta); }

    function keyOf(ta) {
      var d = ta.dataset || {}, k, el, lvl = 0, dd, qt;
      k = d.qid || d.qId || d.id || d.key || d.question || ta.name || ta.id;
      if (k) return "k:" + k;
      el = ta;
      while (el && lvl < 7) {
        el = el.parentElement; lvl++;
        if (!el) break;
        dd = el.dataset || {};
        k = dd.qid || dd.qId || dd.id || dd.key;
        if (k) return "k:" + k;
        if (el.id) return "k:" + el.id;
      }
      qt = questionTextFor(ta);
      if (qt) return "q:" + hash(qt);
      return "i:" + indexOfTa(ta);
    }

    function domItems() {
      var tas = allTextareas(), out = [], i, v;
      for (i = 0; i < tas.length; i++) {
        v = tas[i].value;
        if (v == null || String(v).trim() === "") continue;
        out.push({ key: keyOf(tas[i]), q: questionTextFor(tas[i]), a: String(v) });
      }
      return out;
    }
    function itemsToMap(items) {
      var m = {}, i;
      for (i = 0; i < items.length; i++) m[items[i].key] = items[i].a;
      return m;
    }

    /* ========== 3) 임의 JSON에서 답변 뽑기 ========== */
    var META = /^(schema|version|app|exportedAt|savedAt|count|theme|lang|locale|filter|filters|search|scroll|tab|sort|order|state|ui)$/i;
    function flatten(data, depth, out) {
      out = out || {}; depth = depth || 0;
      if (!data || depth > 4) return out;
      var i, j, ks, k, v, vv, it;
      if (Array.isArray(data)) {
        for (i = 0; i < data.length; i++) {
          it = data[i];
          if (!it || typeof it !== "object") continue;
          k = it.key || it.qid || it.qId || it.id || it.question || it.q;
          v = it.a || it.answer || it.text || it.value || it.myAnswer;
          if (k && typeof v === "string" && v.trim()) out[String(k)] = v;
          else flatten(it, depth + 1, out);
        }
        return out;
      }
      if (typeof data === "object") {
        ks = Object.keys(data);
        for (j = 0; j < ks.length; j++) {
          k = ks[j]; v = data[k];
          if (META.test(k)) continue;
          if (typeof v === "string") { if (v.trim() && v.length < 50000) out[k] = v; }
          else if (v && typeof v === "object") {
            vv = v.a || v.answer || v.text || v.value || v.myAnswer;
            if (typeof vv === "string" && vv.trim()) out[k] = vv;
            else flatten(v, depth + 1, out);
          }
        }
      }
      return out;
    }

    /* ========== 4) 저장 / 스냅샷 ========== */
    function loadMine() {
      var raw = lsGet(MY_KEY) || lsGet(OLD_KEY);
      if (!raw) return { map: {}, items: [] };
      try {
        var o = JSON.parse(raw);
        return { map: o.answers || flatten(o), items: o.items || [] };
      } catch (e) { return { map: {}, items: [] }; }
    }
    function saveMine(map, items) {
      return lsSet(MY_KEY, JSON.stringify({
        schema: SCHEMA, version: VERSION, savedAt: new Date().toISOString(),
        count: Object.keys(map).length, answers: map, items: items
      }));
    }
    function snapshotStorage() {
      var snap = {}, i, k, raw;
      try {
        for (i = 0; i < localStorage.length; i++) {
          k = localStorage.key(i);
          if (!k) continue;
          raw = localStorage.getItem(k);
          if (raw == null || raw.length > 800000) continue;
          if (k === MY_KEY || k === OLD_KEY || /answer|note|interview|qa|memo|draft|질문|답변/i.test(k)) { snap[k] = raw; continue; }
          if (raw.charAt(0) === "{" || raw.charAt(0) === "[") {
            try { if (Object.keys(flatten(JSON.parse(raw))).length) snap[k] = raw; } catch (e) {}
          }
        }
      } catch (e) {}
      return snap;
    }

    /* 현재 상태 = DOM + 내 저장소 + 다른 저장소 */
    function collect() {
      var items = domItems(), map = itemsToMap(items);
      var mine = loadMine(), ks, i;
      ks = Object.keys(mine.map);
      for (i = 0; i < ks.length; i++) if (map[ks[i]] == null) map[ks[i]] = mine.map[ks[i]];
      for (i = 0; i < mine.items.length; i++) {
        var it = mine.items[i];
        if (!it || !it.key) continue;
        var dup = false, j;
        for (j = 0; j < items.length; j++) if (items[j].key === it.key) { dup = true; break; }
        if (!dup) items.push({ key: it.key, q: it.q || "", a: map[it.key] || it.a || "" });
      }
      var snap = snapshotStorage(), sk = Object.keys(snap), extra;
      for (i = 0; i < sk.length; i++) {
        if (sk[i] === MY_KEY || sk[i] === OLD_KEY) continue;
        try { extra = flatten(JSON.parse(snap[sk[i]])); } catch (e) { continue; }
        var ek = Object.keys(extra), n;
        for (n = 0; n < ek.length; n++) if (map[ek[n]] == null) map[ek[n]] = extra[ek[n]];
      }
      return { map: map, items: items, storage: snap };
    }

    var saveTimer = null;
    function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { flush(true); }, DEBOUNCE); }
    function flush(showToast) {
      var c = collect(), ok = saveMine(c.map, c.items);
      if (showToast) toast(ok ? "저장됨 (" + Object.keys(c.map).length + "문항)" : "⚠ 저장 실패");
    }
    document.addEventListener("input", function (e) {
      if (e.target && e.target.tagName === "TEXTAREA") scheduleSave();
    }, false);
    window.addEventListener("beforeunload", function () { flush(false); });

    /* ========== 5) 화면 주입 (비동기 렌더 대응) ========== */
    var pending = null, onlyEmpty = true, until = 0, obs = null;
    function setValue(ta, text) {
      if (ta.value === text) return false;
      ta.value = text;
      ta.dispatchEvent(new Event("input", { bubbles: true }));
      ta.dispatchEvent(new Event("change", { bubbles: true }));
      return true;
    }
    function lookup(ta) {
      if (!pending) return null;
      var k = keyOf(ta), qt = questionTextFor(ta), h = qt ? hash(qt) : "", v;
      v = pending.byKey[k]; if (v != null) return v;
      if (h) { v = pending.byKey["q:" + h]; if (v != null) return v; }
      if (h) { v = pending.byQ[h]; if (v != null) return v; }
      if (qt) { v = pending.byText[normText(qt)]; if (v != null) return v; }
      v = pending.byKey["i:" + indexOfTa(ta)];
      return v == null ? null : v;
    }
    function applyPending() {
      if (!pending) return 0;
      var tas = allTextareas(), i, v, n = 0;
      for (i = 0; i < tas.length; i++) {
        v = lookup(tas[i]);
        if (v == null) continue;
        if (onlyEmpty && String(tas[i].value || "").trim() !== "") continue;
        if (setValue(tas[i], String(v))) n++;
      }
      return n;
    }
    function startApply(bundle, oe) {
      pending = bundle; onlyEmpty = !!oe; until = Date.now() + APPLY_WINDOW;
      var n = applyPending();
      if (!obs) {
        obs = new MutationObserver(function () {
          if (Date.now() > until) { obs.disconnect(); obs = null; pending = null; return; }
          applyPending();
        });
        obs.observe(document.body, { childList: true, subtree: true });
      }
      return n;
    }
    function bundleOf(map, items) {
      var b = { byKey: map || {}, byQ: {}, byText: {} }, i, it;
      items = items || [];
      for (i = 0; i < items.length; i++) {
        it = items[i];
        if (!it || !it.a || String(it.a).trim() === "") continue;
        if (it.q) { b.byQ[hash(normText(it.q))] = it.a; b.byText[normText(it.q)] = it.a; }
      }
      return b;
    }

    function restore() {
      var mine = loadMine();
      if (Object.keys(mine.map).length || mine.items.length) startApply(bundleOf(mine.map, mine.items), true);
    }

    /* ========== 6) 내보내기 ========== */
    function stamp() {
      var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes());
    }
    function download(obj, name) {
      var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    function doExport() {
      flush(false);
      var c = collect(), n = Object.keys(c.map).length;
      if (n === 0) {
        var tas = allTextareas().length;
        if (!confirm("수집된 답변이 0건입니다.\n(화면 textarea " + tas + "개 / 저장소 후보 " +
          Object.keys(c.storage).length + "개)\n\n답변을 입력한 상태인지 확인하세요.\n그래도 파일을 만들까요?")) return;
      }
      download({
        schema: SCHEMA, version: VERSION, app: "면접 예상질문 노트",
        exportedAt: new Date().toISOString(), count: n,
        answers: c.map, items: c.items, storage: c.storage
      }, "면접답변_" + stamp() + ".json");
      toast("내보내기 완료 · " + n + "문항");
    }

    /* ========== 7) 불러오기 ========== */
    function parseIncoming(data) {
      var map = {}, items = [], i, it, ks, k;
      if (data && Array.isArray(data.items)) {
        for (i = 0; i < data.items.length; i++) {
          it = data.items[i] || {};
          var a = it.a || it.answer || it.text || it.value;
          if (a == null || String(a).trim() === "") continue;
          k = it.key || it.qid || it.id || (it.q ? "q:" + hash(normText(it.q)) : null);
          items.push({ key: k, q: it.q || it.question || "", a: String(a) });
          if (k) map[k] = String(a);
        }
      }
      var flat = flatten(data && (data.answers || data.data || data.notes) ? (data.answers || data.data || data.notes) : data);
      ks = Object.keys(flat);
      for (i = 0; i < ks.length; i++) if (map[ks[i]] == null) map[ks[i]] = flat[ks[i]];
      return { map: map, items: items };
    }

    function restoreRawStorage(storage) {
      var ks = Object.keys(storage || {}), i, n = 0;
      for (i = 0; i < ks.length; i++) if (lsSet(ks[i], storage[ks[i]])) n++;
      return n;
    }

    function doImport(file) {
      if (!file) return;
      var fr = new FileReader();
      fr.onload = function () {
        var data;
        try { data = JSON.parse(String(fr.result)); }
        catch (e) { alert("JSON 형식이 아닙니다.\n" + e.message); return; }

        var inc = parseIncoming(data), n = Object.keys(inc.map).length;
        var hasStorage = data && data.storage && Object.keys(data.storage).length > 0;

        if (n === 0 && hasStorage) {
          if (confirm("문항 단위 답변은 없지만 저장소 백업이 있습니다.\n원본 저장소를 복원하고 새로고침할까요?")) {
            restoreRawStorage(data.storage);
            location.reload(); return;
          }
        }
        if (n === 0) {
          alert("불러올 답변이 없습니다.\n\n[파일 진단]\n최상위 키: " +
            Object.keys(data || {}).slice(0, 12).join(", ") +
            "\ncount 값: " + (data && data.count) +
            "\n\n※ count가 0이면 내보내기 시점에 답변이 수집되지 않은 파일입니다. 답변 입력 후 다시 내보내세요.");
          return;
        }

        var overwrite = confirm("불러올 답변 " + n + "문항.\n\n[확인] 덮어쓰기\n[취소] 병합(빈 칸만 채우기)");

        var cur = collect(), ks = Object.keys(inc.map), i, k;
        for (i = 0; i < ks.length; i++) {
          k = ks[i];
          if (!overwrite && cur.map[k] != null && String(cur.map[k]).trim() !== "") continue;
          cur.map[k] = inc.map[k];
        }
        var mergedItems = cur.items.concat(inc.items);
        saveMine(cur.map, mergedItems);
        if (hasStorage && overwrite) restoreRawStorage(data.storage);

        var applied = startApply(bundleOf(cur.map, mergedItems), !overwrite);
        toast("불러오기 완료 · " + n + "문항 (반영 " + applied + "개)");
        if (applied === 0 && confirm("저장은 됐지만 화면 반영이 확인되지 않았습니다.\n새로고침할까요?")) location.reload();
      };
      fr.onerror = function () { alert("파일을 읽을 수 없습니다."); };
      fr.readAsText(file, "utf-8");
    }

    /* ========== 8) 진단 명령 ========== */
    window.__noteDiag = function () {
      var tas = allTextareas(), rows = tas.slice(0, 20).map(function (t) {
        return { key: keyOf(t), q: questionTextFor(t).slice(0, 40), len: (t.value || "").length };
      });
      var c = collect();
      console.log("textarea 수:", tas.length, "| 수집 답변:", Object.keys(c.map).length,
                  "| 저장소 후보:", Object.keys(c.storage));
      console.table(rows);
      return { textareas: tas.length, collected: Object.keys(c.map).length, storageKeys: Object.keys(c.storage) };
    };

    /* ========== 9) 버튼 연결 (캡처 단계 선점) ========== */
    function bind() {
      var btn = $("#btn-export"), fi = $("#file-import");
      if (btn && !btn.dataset.patched) {
        btn.dataset.patched = "1";
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          doExport();
        }, true);
      }
      if (fi && !fi.dataset.patched) {
        fi.dataset.patched = "1";
        fi.addEventListener("change", function (e) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          var f = fi.files && fi.files[0];
          doImport(f);
          fi.value = "";
        }, true);
      }
      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); flush(true); }
      });
      restore();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind);
    else bind();
  })();
  </script>
  <!-- ▲▲▲ [추가] 패치 v2 끝 ▲▲▲ -->
</body>
</html>
