  <div class="layout">

  <!-- 기존 앱 로직 유지 -->
  <script src="assets/app.js"></script>

  <!--
    답변 자동저장 + JSON 내보내기/불러오기 + Word 내보내기 패치 v3

    주요 보완:
    1. PSC1-V-01과 k:PSC1-V-01을 같은 문항으로 인식
    2. { a, k, s, u } 답변 객체 지원
    3. schemaVersion 형식 지원
    4. 비동기 화면 렌더링 대응
    5. Word(.doc) 백업 지원
  -->
  <script>
  (function () {
    "use strict";

    /* =========================================================
       0) 설정
    ========================================================= */

    var MY_KEY = "interview-note:answers:v3";
    var PREVIOUS_KEY = "interview-note:answers:v2";
    var OLD_KEY = "interview-note:answers:v1";

    var SCHEMA = "interview-note-answers";
    var VERSION = 3;

    var DEBOUNCE = 400;
    var APPLY_WINDOW = 30000;

    /* =========================================================
       1) 기본 유틸
    ========================================================= */

    function $(selector, root) {
      return (root || document).querySelector(selector);
    }

    function all(selector, root) {
      return Array.prototype.slice.call(
        (root || document).querySelectorAll(selector)
      );
    }

    var toastEl = $("#toast");
    var toastTimer = null;

    function toast(message, duration) {
      duration = duration || 2600;

      if (!toastEl) {
        console.log("[interview-note]", message);
        return;
      }

      toastEl.textContent = message;
      toastEl.hidden = false;

      clearTimeout(toastTimer);

      toastTimer = setTimeout(function () {
        toastEl.hidden = true;
      }, duration);
    }

    function lsGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    function lsSet(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (error) {
        console.error("[interview-note] localStorage 저장 실패:", error);
        return false;
      }
    }

    function hash(value) {
      var text = String(value == null ? "" : value);
      var h = 5381;
      var i;

      for (i = 0; i < text.length; i++) {
        h = ((h << 5) + h) + text.charCodeAt(i);
        h |= 0;
      }

      return (h >>> 0).toString(36);
    }

    function normText(value) {
      return String(value == null ? "" : value)
        .replace(/\s+/g, " ")
        .replace(/^[\s\-•·]*[0-9]{1,3}[.)\]
]\s*/, "")
        .trim();
    }

    function isNonEmpty(value) {
      return value != null && String(value).trim() !== "";
    }

    function unique(values) {
      var result = [];
      var seen = {};
      var i;
      var value;

      for (i = 0; i < values.length; i++) {
        value = values[i];

        if (value == null) {
          continue;
        }

        value = String(value).trim();

        if (!value || seen[value]) {
          continue;
        }

        seen[value] = true;
        result.push(value);
      }

      return result;
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function nl2br(value) {
      return escapeHtml(value).replace(/\r?\n/g, "<br>");
    }

    function formatDate(value) {
      if (!value) {
        return "";
      }

      try {
        var date = new Date(value);

        if (isNaN(date.getTime())) {
          return "";
        }

        return date.toLocaleString("ko-KR");
      } catch (error) {
        return "";
      }
    }

    /* =========================================================
       2) 키 호환 처리

       예:
       PSC1-V-01
       k:PSC1-V-01

       위 두 값을 동일 문항 후보로 처리합니다.
    ========================================================= */

    function keyAliases(key) {
      if (key == null) {
        return [];
      }

      var original = String(key).trim();
      var aliases = [original];
      var raw;

      if (!original) {
        return [];
      }

      if (original.indexOf("k:") === 0) {
        raw = original.slice(2);

        if (raw) {
          aliases.push(raw);
        }
      } else if (
        original.indexOf("q:") !== 0 &&
        original.indexOf("i:") !== 0
      ) {
        aliases.push("k:" + original);
      }

      return unique(aliases);
    }

    function findMapValue(map, key) {
      var aliases = keyAliases(key);
      var i;
      var alias;

      for (i = 0; i < aliases.length; i++) {
        alias = aliases[i];

        if (
          map &&
          Object.prototype.hasOwnProperty.call(map, alias) &&
          map[alias] != null
        ) {
          return map[alias];
        }
      }

      return null;
    }

    function findMapKey(map, key) {
      var aliases = keyAliases(key);
      var i;

      for (i = 0; i < aliases.length; i++) {
        if (
          map &&
          Object.prototype.hasOwnProperty.call(map, aliases[i])
        ) {
          return aliases[i];
        }
      }

      return null;
    }

    function setMapCompatible(map, key, value, overwrite) {
      if (!map || key == null) {
        return false;
      }

      var existingKey = findMapKey(map, key);
      var targetKey = existingKey || String(key).trim();

      if (!targetKey) {
        return false;
      }

      if (
        !overwrite &&
        existingKey &&
        isNonEmpty(map[existingKey])
      ) {
        return false;
      }

      map[targetKey] = String(value == null ? "" : value);
      return true;
    }

    /* =========================================================
       3) 질문 문구 추출
    ========================================================= */

    var Q_SELS = [
      "[data-question]",
      ".question",
      ".q",
      ".q-title",
      ".qtext",
      ".q-text",
      "h2",
      "h3",
      "h4",
      "h5",
      "legend",
      "summary",
      "label",
      "strong",
      "b",
      "p"
    ].join(",");

    function questionTextFor(textarea) {
      var node = textarea;
      var level = 0;
      var candidates;
      var i;
      var text;
      var dataQuestion;

      while (node && level < 7) {
        node = node.parentElement;
        level++;

        if (!node) {
          break;
        }

        if (node.dataset) {
          dataQuestion =
            node.dataset.question ||
            node.dataset.q ||
            node.dataset.title;

          if (
            dataQuestion &&
            normText(dataQuestion).length > 3
          ) {
            return normText(dataQuestion);
          }
        }

        candidates = node.querySelectorAll(Q_SELS);

        for (i = 0; i < candidates.length; i++) {
          if (candidates[i].contains(textarea)) {
            continue;
          }

          text = normText(candidates[i].textContent);

          if (text.length >= 6 && text.length <= 400) {
            return text;
          }
        }
      }

      return normText(
        textarea.getAttribute("aria-label") ||
        textarea.getAttribute("placeholder") ||
        ""
      );
    }

    /* =========================================================
       4) textarea 문항 키 결정
    ========================================================= */

    function allTextareas() {
      return all("textarea");
    }

    function indexOfTextarea(textarea) {
      return allTextareas().indexOf(textarea);
    }

    function keyOf(textarea) {
      var data = textarea.dataset || {};
      var key;
      var element = textarea;
      var level = 0;
      var parentData;
      var questionText;

      key =
        data.qid ||
        data.qId ||
        data.id ||
        data.key ||
        data.question ||
        textarea.name ||
        textarea.id;

      if (key) {
        return "k:" + key;
      }

      while (element && level < 7) {
        element = element.parentElement;
        level++;

        if (!element) {
          break;
        }

        parentData = element.dataset || {};

        key =
          parentData.qid ||
          parentData.qId ||
          parentData.id ||
          parentData.key;

        if (key) {
          return "k:" + key;
        }

        if (element.id) {
          return "k:" + element.id;
        }
      }

      questionText = questionTextFor(textarea);

      if (questionText) {
        return "q:" + hash(questionText);
      }

      return "i:" + indexOfTextarea(textarea);
    }

    function domItems() {
      var textareas = allTextareas();
      var result = [];
      var i;
      var value;

      for (i = 0; i < textareas.length; i++) {
        value = textareas[i].value;

        if (!isNonEmpty(value)) {
          continue;
        }

        result.push({
          key: keyOf(textareas[i]),
          q: questionTextFor(textareas[i]),
          a: String(value)
        });
      }

      return result;
    }

    function itemsToMap(items) {
      var map = {};
      var i;

      for (i = 0; i < items.length; i++) {
        if (!items[i] || !items[i].key) {
          continue;
        }

        map[items[i].key] = String(items[i].a || "");
      }

      return map;
    }

    /* =========================================================
       5) 임의 JSON에서 답변 추출
    ========================================================= */

    var META = /^(schema|schemaVersion|version|app|exportedAt|savedAt|count|theme|lang|locale|filter|filters|search|scroll|tab|sort|order|state|ui|storage|updated)$/i;

    function answerFromObject(value) {
      if (!value || typeof value !== "object") {
        return null;
      }

      if (typeof value.a === "string") {
        return value.a;
      }

      if (typeof value.answer === "string") {
        return value.answer;
      }

      if (typeof value.text === "string") {
        return value.text;
      }

      if (typeof value.value === "string") {
        return value.value;
      }

      if (typeof value.myAnswer === "string") {
        return value.myAnswer;
      }

      return null;
    }

    function flatten(data, depth, output) {
      output = output || {};
      depth = depth || 0;

      if (!data || depth > 5) {
        return output;
      }

      var i;
      var keys;
      var key;
      var value;
      var answer;
      var itemKey;

      if (Array.isArray(data)) {
        for (i = 0; i < data.length; i++) {
          value = data[i];

          if (!value || typeof value !== "object") {
            continue;
          }

          itemKey =
            value.key ||
            value.qid ||
            value.qId ||
            value.id ||
            value.question ||
            value.q;

          answer = answerFromObject(value);

          if (itemKey && isNonEmpty(answer)) {
            output[String(itemKey)] = String(answer);
          } else {
            flatten(value, depth + 1, output);
          }
        }

        return output;
      }

      if (typeof data === "object") {
        keys = Object.keys(data);

        for (i = 0; i < keys.length; i++) {
          key = keys[i];
          value = data[key];

          if (META.test(key)) {
            continue;
          }

          if (typeof value === "string") {
            if (
              value.trim() &&
              value.length < 50000
            ) {
              output[key] = value;
            }

            continue;
          }

          if (value && typeof value === "object") {
            answer = answerFromObject(value);

            if (isNonEmpty(answer)) {
              output[key] = String(answer);
            } else {
              flatten(value, depth + 1, output);
            }
          }
        }
      }

      return output;
    }

    /* =========================================================
       6) JSON 답변 객체를 items로 변환

       다음 형식을 지원합니다.

       "PSC1-V-01": {
         "a": "답변",
         "k": "배관분리 공단질의",
         "s": "done",
         "u": 1787096049184
       }
    ========================================================= */

    function answerObjectsToItems(answers) {
      var result = [];

      if (!answers || typeof answers !== "object") {
        return result;
      }

      var keys = Object.keys(answers);
      var i;
      var key;
      var value;
      var answer;

      for (i = 0; i < keys.length; i++) {
        key = keys[i];
        value = answers[key];

        if (typeof value === "string") {
          if (isNonEmpty(value)) {
            result.push({
              key: key,
              q: "",
              a: value,
              keyword: "",
              status: "",
              updatedAt: null
            });
          }

          continue;
        }

        if (!value || typeof value !== "object") {
          continue;
        }

        answer = answerFromObject(value);

        if (!isNonEmpty(answer)) {
          continue;
        }

        result.push({
          key: key,
          q:
            value.q ||
            value.question ||
            value.title ||
            "",
          a: String(answer),
          keyword:
            value.k ||
            value.keyword ||
            value.tag ||
            "",
          status:
            value.s ||
            value.status ||
            "",
          updatedAt:
            value.u ||
            value.updatedAt ||
            value.modifiedAt ||
            null
        });
      }

      return result;
    }

    /* =========================================================
       7) 저장 및 스냅샷
    ========================================================= */

    function emptyMine() {
      return {
        map: {},
        items: []
      };
    }

    function parseStored(raw) {
      if (!raw) {
        return emptyMine();
      }

      try {
        var parsed = JSON.parse(raw);

        return {
          map: parsed.answers || flatten(parsed),
          items: Array.isArray(parsed.items)
            ? parsed.items
            : answerObjectsToItems(parsed.answers)
        };
      } catch (error) {
        return emptyMine();
      }
    }

    function loadMine() {
      var current = parseStored(lsGet(MY_KEY));

      if (
        Object.keys(current.map).length ||
        current.items.length
      ) {
        return current;
      }

      var previous = parseStored(lsGet(PREVIOUS_KEY));

      if (
        Object.keys(previous.map).length ||
        previous.items.length
      ) {
        return previous;
      }

      return parseStored(lsGet(OLD_KEY));
    }

    function saveMine(map, items) {
      return lsSet(
        MY_KEY,
        JSON.stringify({
          schema: SCHEMA,
          schemaVersion: "3.0.0",
          version: VERSION,
          savedAt: new Date().toISOString(),
          count: Object.keys(map).length,
          answers: map,
          items: items
        })
      );
    }

    function snapshotStorage() {
      var snapshot = {};
      var i;
      var key;
      var raw;

      try {
        for (i = 0; i < localStorage.length; i++) {
          key = localStorage.key(i);

          if (!key) {
            continue;
          }

          raw = localStorage.getItem(key);

          if (
            raw == null ||
            raw.length > 800000
          ) {
            continue;
          }

          if (
            key === MY_KEY ||
            key === PREVIOUS_KEY ||
            key === OLD_KEY ||
            /answer|note|interview|qa|memo|draft|질문|답변/i.test(key)
          ) {
            snapshot[key] = raw;
            continue;
          }

          if (
            raw.charAt(0) === "{" ||
            raw.charAt(0) === "["
          ) {
            try {
              if (
                Object.keys(
                  flatten(JSON.parse(raw))
                ).length
              ) {
                snapshot[key] = raw;
              }
            } catch (error) {
              /* JSON이 아닌 저장소는 무시 */
            }
          }
        }
      } catch (error) {
        console.warn(
          "[interview-note] 저장소 스냅샷 생성 실패:",
          error
        );
      }

      return snapshot;
    }

    function itemExists(items, item) {
      var i;

      for (i = 0; i < items.length; i++) {
        if (!items[i]) {
          continue;
        }

        if (
          findMapKey(
            (function () {
              var temp = {};
              temp[items[i].key] = true;
              return temp;
            })(),
            item.key
          )
        ) {
          return true;
        }

        if (
          items[i].q &&
          item.q &&
          normText(items[i].q) === normText(item.q)
        ) {
          return true;
        }
      }

      return false;
    }

    function mergeItems(baseItems, incomingItems) {
      var result = (baseItems || []).slice();
      var i;

      for (i = 0; i < (incomingItems || []).length; i++) {
        if (!incomingItems[i]) {
          continue;
        }

        if (!itemExists(result, incomingItems[i])) {
          result.push(incomingItems[i]);
        }
      }

      return result;
    }

    /* 현재 상태 = DOM + 내 저장소 + 기타 저장소 */
    function collect() {
      var items = domItems();
      var map = itemsToMap(items);
      var mine = loadMine();

      var keys;
      var i;
      var existingKey;
      var snapshot;
      var storageKeys;
      var extra;
      var extraKeys;
      var n;

      keys = Object.keys(mine.map);

      for (i = 0; i < keys.length; i++) {
        existingKey = findMapKey(map, keys[i]);

        if (!existingKey) {
          map[keys[i]] = mine.map[keys[i]];
        }
      }

      items = mergeItems(items, mine.items);

      snapshot = snapshotStorage();
      storageKeys = Object.keys(snapshot);

      for (i = 0; i < storageKeys.length; i++) {
        if (
          storageKeys[i] === MY_KEY ||
          storageKeys[i] === PREVIOUS_KEY ||
          storageKeys[i] === OLD_KEY
        ) {
          continue;
        }

        try {
          extra = flatten(
            JSON.parse(snapshot[storageKeys[i]])
          );
        } catch (error) {
          continue;
        }

        extraKeys = Object.keys(extra);

        for (n = 0; n < extraKeys.length; n++) {
          if (!findMapKey(map, extraKeys[n])) {
            map[extraKeys[n]] = extra[extraKeys[n]];
          }
        }
      }

      return {
        map: map,
        items: items,
        storage: snapshot
      };
    }

    var saveTimer = null;

    function scheduleSave() {
      clearTimeout(saveTimer);

      saveTimer = setTimeout(function () {
        flush(true);
      }, DEBOUNCE);
    }

    function flush(showToast) {
      var collected = collect();
      var success = saveMine(
        collected.map,
        collected.items
      );

      if (showToast) {
        toast(
          success
            ? "저장됨 (" +
              Object.keys(collected.map).length +
              "문항)"
            : "⚠ 저장 실패"
        );
      }
    }

    document.addEventListener(
      "input",
      function (event) {
        if (
          event.target &&
          event.target.tagName === "TEXTAREA"
        ) {
          scheduleSave();
        }
      },
      false
    );

    window.addEventListener(
      "beforeunload",
      function () {
        flush(false);
      }
    );

    /* =========================================================
       8) 화면 답변 주입
    ========================================================= */

    var pending = null;
    var onlyEmpty = true;
    var applyUntil = 0;
    var observer = null;
    var lastApplyReport = null;

    function setValue(textarea, text) {
      if (textarea.value === text) {
        return false;
      }

      textarea.value = text;

      textarea.dispatchEvent(
        new Event("input", {
          bubbles: true
        })
      );

      textarea.dispatchEvent(
        new Event("change", {
          bubbles: true
        })
      );

      return true;
    }

    function lookup(textarea) {
      if (!pending) {
        return null;
      }

      var key = keyOf(textarea);
      var aliases = keyAliases(key);
      var questionText = questionTextFor(textarea);
      var questionHash = questionText
        ? hash(questionText)
        : "";

      var i;
      var value;

      /* 핵심 보완: k:PSC1-V-01과 PSC1-V-01 모두 검색 */
      for (i = 0; i < aliases.length; i++) {
        value = pending.byKey[aliases[i]];

        if (value != null) {
          return value;
        }
      }

      if (questionHash) {
        value = pending.byKey["q:" + questionHash];

        if (value != null) {
          return value;
        }
      }

      if (questionHash) {
        value = pending.byQ[questionHash];

        if (value != null) {
          return value;
        }
      }

      if (questionText) {
        value = pending.byText[
          normText(questionText)
        ];

        if (value != null) {
          return value;
        }
      }

      value = pending.byKey[
        "i:" + indexOfTextarea(textarea)
      ];

      return value == null ? null : value;
    }

    function applyPending() {
      if (!pending) {
        return {
          applied: 0,
          matched: 0,
          totalTextareas: allTextareas().length
        };
      }

      var textareas = allTextareas();
      var i;
      var value;

      var applied = 0;
      var matched = 0;

      for (i = 0; i < textareas.length; i++) {
        value = lookup(textareas[i]);

        if (value == null) {
          continue;
        }

        matched++;

        if (
          onlyEmpty &&
          isNonEmpty(textareas[i].value)
        ) {
          continue;
        }

        if (
          setValue(
            textareas[i],
            String(value)
          )
        ) {
          applied++;
        }
      }

      lastApplyReport = {
        applied: applied,
        matched: matched,
        totalTextareas: textareas.length
      };

      return lastApplyReport;
    }

    function stopObserver() {
      if (observer) {
        observer.disconnect();
        observer = null;
      }
    }

    function startApply(bundle, fillOnlyEmpty) {
      pending = bundle;
      onlyEmpty = !!fillOnlyEmpty;
      applyUntil = Date.now() + APPLY_WINDOW;

      var firstReport = applyPending();

      stopObserver();

      observer = new MutationObserver(function () {
        if (Date.now() > applyUntil) {
          stopObserver();
          pending = null;
          return;
        }

        applyPending();
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });

      return firstReport;
    }

    function bundleOf(map, items) {
      var bundle = {
        byKey: {},
        byQ: {},
        byText: {}
      };

      var keys = Object.keys(map || {});
      var i;
      var item;
      var aliases;
      var n;

      /*
       * byKey에는 원본 키와 호환 키를 모두 등록합니다.
       * 예: PSC1-V-01, k:PSC1-V-01
       */
      for (i = 0; i < keys.length; i++) {
        aliases = keyAliases(keys[i]);

        for (n = 0; n < aliases.length; n++) {
          bundle.byKey[aliases[n]] = map[keys[i]];
        }
      }

      items = items || [];

      for (i = 0; i < items.length; i++) {
        item = items[i];

        if (
          !item ||
          !isNonEmpty(item.a)
        ) {
          continue;
        }

        aliases = keyAliases(item.key);

        for (n = 0; n < aliases.length; n++) {
          bundle.byKey[aliases[n]] = item.a;
        }

        if (item.q) {
          bundle.byQ[
            hash(normText(item.q))
          ] = item.a;

          bundle.byText[
            normText(item.q)
          ] = item.a;
        }
      }

      return bundle;
    }

    function restore() {
      var mine = loadMine();

      if (
        Object.keys(mine.map).length ||
        mine.items.length
      ) {
        startApply(
          bundleOf(mine.map, mine.items),
          true
        );
      }
    }

    function stamp() {
      var date = new Date();

      function pad(number) {
        return number < 10
          ? "0" + number
          : String(number);
      }

      return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth() + 1) +
        "-" +
        pad(date.getDate()) +
        "_" +
        pad(date.getHours()) +
        pad(date.getMinutes())
      );
    }

    function downloadBlob(blob, fileName) {
      var url = URL.createObjectURL(blob);
      var anchor = document.createElement("a");

      anchor.href = url;
      anchor.download = fileName;

      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();

      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    function downloadJson(object, fileName) {
      var blob = new Blob(
        [JSON.stringify(object, null, 2)],
        {
          type: "application/json;charset=utf-8"
        }
      );

      downloadBlob(blob, fileName);
    }

    function normalizedExportItems(collected) {
      var result = [];
      var used = {};
      var items = collected.items || [];
      var map = collected.map || {};

      var i;
      var item;
      var key;
      var aliases;
      var n;
      var answer;
      var mapKeys;

      for (i = 0; i < items.length; i++) {
        item = items[i];

        if (!item) {
          continue;
        }

        key = item.key || "";
        answer =
          findMapValue(map, key) ||
          item.a ||
          "";

        if (!isNonEmpty(answer)) {
          continue;
        }

        result.push({
          key: key,
          q: item.q || "",
          a: String(answer),
          keyword: item.keyword || "",
          status: item.status || "",
          updatedAt: item.updatedAt || null
        });

        aliases = keyAliases(key);

        for (n = 0; n < aliases.length; n++) {
          used[aliases[n]] = true;
        }
      }

      mapKeys = Object.keys(map);

      for (i = 0; i < mapKeys.length; i++) {
        key = mapKeys[i];
        aliases = keyAliases(key);

        var alreadyUsed = false;

        for (n = 0; n < aliases.length; n++) {
          if (used[aliases[n]]) {
            alreadyUsed = true;
            break;
          }
        }

        if (alreadyUsed) {
          continue;
        }

        if (!isNonEmpty(map[key])) {
          continue;
        }

        result.push({
          key: key,
          q: "",
          a: String(map[key]),
          keyword: "",
          status: "",
          updatedAt: null
        });

        for (n = 0; n < aliases.length; n++) {
          used[aliases[n]] = true;
        }
      }

      return result;
    }

    function parseIncoming(data) {
      var map = {};
      var items = [];

      var i;
      var item;
      var answer;
      var key;
      var flat;
      var keys;
      var answerItems;

      if (
        data &&
        Array.isArray(data.items)
      ) {
        for (i = 0; i < data.items.length; i++) {
          item = data.items[i] || {};

          answer = answerFromObject(item);

          if (!isNonEmpty(answer)) {
            continue;
          }

          key =
            item.key ||
            item.qid ||
            item.qId ||
            item.id ||
            (
              item.q
                ? "q:" +
                  hash(normText(item.q))
                : null
            );

          items.push({
            key: key,
            q:
              item.q ||
              item.question ||
              "",
            a: String(answer),
            keyword:
              item.keyword ||
              item.k ||
              "",
            status:
              item.status ||
              item.s ||
              "",
            updatedAt:
              item.updatedAt ||
              item.u ||
              null
          });

          if (key) {
            map[key] = String(answer);
          }
        }
      }

      /*
       * 질문에 제시된 JSON 형식 전용 보완
       */
      if (
        data &&
        data.answers &&
        typeof data.answers === "object"
      ) {
        answerItems =
          answerObjectsToItems(data.answers);

        items = mergeItems(
          items,
          answerItems
        );
      }

      flat = flatten(
        data &&
        (
          data.answers ||
          data.data ||
          data.notes
        )
          ? (
              data.answers ||
              data.data ||
              data.notes
            )
          : data
      );

      keys = Object.keys(flat);

      for (i = 0; i < keys.length; i++) {
        if (!findMapKey(map, keys[i])) {
          map[keys[i]] = flat[keys[i]];
        }
      }

      return {
        map: map,
        items: items
      };
    }

    function restoreRawStorage(storage) {
      var keys = Object.keys(storage || {});
      var i;
      var restored = 0;

      for (i = 0; i < keys.length; i++) {
        if (
          lsSet(
            keys[i],
            storage[keys[i]]
          )
        ) {
          restored++;
        }
      }

      return restored;
    }

    function mergeIncoming(
      currentMap,
      incomingMap,
      overwrite
    ) {
      var keys = Object.keys(incomingMap);
      var i;
      var key;
      var changed = 0;
      var skipped = 0;

      for (i = 0; i < keys.length; i++) {
        key = keys[i];

        if (
          setMapCompatible(
            currentMap,
            key,
            incomingMap[key],
            overwrite
          )
        ) {
          changed++;
        } else {
          skipped++;
        }
      }

      return {
        changed: changed,
        skipped: skipped
      };
    }

    function doImport(file) {
      if (!file) {
        return;
      }

      var fileReader = new FileReader();

      fileReader.onload = function () {
        var data;

        try {
          data = JSON.parse(
            String(fileReader.result)
          );
        } catch (error) {
          alert(
            "JSON 형식이 아닙니다.\n\n" +
            error.message
          );
          return;
        }

        var incoming = parseIncoming(data);
        var count =
          Object.keys(incoming.map).length;

        var hasStorage =
          data &&
          data.storage &&
          typeof data.storage === "object" &&
          Object.keys(data.storage).length > 0;

        if (
          count === 0 &&
          hasStorage
        ) {
          if (
            confirm(
              "문항 단위 답변은 없지만 저장소 백업이 있습니다.\n\n" +
              "원본 저장소를 복원하고 새로고침할까요?"
            )
          ) {
            restoreRawStorage(data.storage);
            location.reload();
            return;
          }
        }

        if (count === 0) {
          alert(
            "불러올 답변이 없습니다.\n\n" +
            "[파일 진단]\n" +
            "최상위 키: " +
            Object.keys(data || {})
              .slice(0, 12)
              .join(", ") +
            "\ncount 값: " +
            (data && data.count) +
            "\nschemaVersion: " +
            (data && data.schemaVersion) +
            "\n\n" +
            "답변이 answers 객체 안에 있는지 확인해 주세요."
          );
          return;
        }

        var overwrite = confirm(
          "불러올 답변: " +
          count +
          "문항\n\n" +
          "[확인] 기존 답변도 가져온 파일 내용으로 덮어쓰기\n" +
          "[취소] 기존 답변은 유지하고 빈 문항만 채우기"
        );

        var current = collect();

        var mergeReport = mergeIncoming(
          current.map,
          incoming.map,
          overwrite
        );

        var mergedItems = mergeItems(
          current.items,
          incoming.items
        );

        saveMine(
          current.map,
          mergedItems
        );

        if (
          hasStorage &&
          overwrite
        ) {
          restoreRawStorage(data.storage);
        }

        var applyReport = startApply(
          bundleOf(
            current.map,
            mergedItems
          ),
          !overwrite
        );

        toast(
          "불러오기 완료 · " +
          count +
          "문항 / 화면 반영 " +
          applyReport.applied +
          "개",
          4000
        );

        console.log(
          "[interview-note] 불러오기 결과",
          {
            imported: count,
            merged: mergeReport.changed,
            skipped: mergeReport.skipped,
            applied: applyReport.applied,
            matched: applyReport.matched,
            textareas: applyReport.totalTextareas,
            incomingKeys:
              Object.keys(incoming.map),
            screenKeys:
              allTextareas().map(function (textarea) {
                return keyOf(textarea);
              })
          }
        );

        /*
         * 비동기 렌더링을 고려해 잠시 기다린 후 재확인합니다.
         */
        setTimeout(function () {
          var delayedReport = applyPending();

          if (
            delayedReport.applied > 0
          ) {
            toast(
              "불러오기 완료 · 화면 반영 " +
              delayedReport.applied +
              "개",
              3500
            );

            flush(false);
            return;
          }

          if (
            applyReport.applied === 0 &&
            delayedReport.matched === 0
          ) {
            showNoApplyMessage(
              count,
              delayedReport
            );
          } else if (
            applyReport.applied === 0 &&
            delayedReport.matched > 0
          ) {
            toast(
              "불러오기 완료 · 일치 문항은 있으나 기존 값이 유지되었습니다.",
              4500
            );
          }
        }, 1800);
      };

      fileReader.onerror = function () {
        alert(
          "파일을 읽을 수 없습니다."
        );
      };

      fileReader.readAsText(
        file,
        "utf-8"
      );
    }

        textareas.length,
        "| 수집 답변:",
        Object.keys(collected.map).length,
        "| 저장소 후보:",
        Object.keys(collected.storage)
      );

      console.table(rows);

      return {
        textareas: textareas.length,
        collected:
          Object.keys(collected.map).length,
        answerKeys:
          Object.keys(collected.map),
        storageKeys:
          Object.keys(collected.storage),
        lastApplyReport:
          lastApplyReport
      };
    };

    /* =========================================================
       14) 버튼 연결
    ========================================================= */

    function bind() {
      var exportButton = $("#btn-export");
      var wordButton = $("#btn-export-word");
      var fileInput = $("#file-import");

      if (
        exportButton &&
        !exportButton.dataset.notePatched
      ) {
        exportButton.dataset.notePatched = "1";

        exportButton.addEventListener(
          "click",
          function (event) {
            event.preventDefault();

            if (
              event.stopImmediatePropagation
            ) {
              event.stopImmediatePropagation();
            }

            doExport();
          },
          true
        );
      }

      if (
        wordButton &&
        !wordButton.dataset.notePatched
      ) {
        wordButton.dataset.notePatched = "1";

        wordButton.addEventListener(
          "click",
          function (event) {
            event.preventDefault();

            if (
              event.stopImmediatePropagation
            ) {
              event.stopImmediatePropagation();
            }

            doWordExport();
          },
          true
        );
      }

      if (
        fileInput &&
        !fileInput.dataset.notePatched
      ) {
        fileInput.dataset.notePatched = "1";

        fileInput.addEventListener(
          "change",
          function (event) {
            if (
              event.stopImmediatePropagation
            ) {
              event.stopImmediatePropagation();
            }

            var file =
              fileInput.files &&
              fileInput.files[0];

            doImport(file);

            /*
             * 같은 파일을 연속해서 선택할 수 있도록 초기화
             */
            fileInput.value = "";
          },
          true
        );
      }

      document.addEventListener(
        "keydown",
        function (event) {
          if (
            (event.ctrlKey || event.metaKey) &&
            (
              event.key === "s" ||
              event.key === "S"
            )
          ) {
            event.preventDefault();
            flush(true);
          }
        }
      );

      restore();
    }

    if (
      document.readyState === "loading"
    ) {
      document.addEventListener(
        "DOMContentLoaded",
        bind
      );
    } else {
      bind();
    }
  })();
  </script>
</body>
</html>
