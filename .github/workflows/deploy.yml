name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 시크릿 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 비어 있습니다. Settings > Secrets and variables > Actions 에서 등록하세요."
            exit 1
          fi
          echo "시크릿 확인 완료 (길이: ${#GEMINI_API_KEY})"

      - name: 플레이스홀더 탐색 및 API 키 주입
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, io, sys
          key = os.environ['GEMINI_API_KEY'].strip()
          token = '__GEMINI_API_KEY__'
          targets = []

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github', 'node_modules')]
              for f in files:
                  if not f.endswith(('.js', '.html')):
                      continue
                  p = os.path.join(root, f)
                  try:
                      s = io.open(p, encoding='utf-8').read()
                  except Exception:
                      continue
                  if token in s:
                      io.open(p, 'w', encoding='utf-8').write(s.replace(token, key))
                      targets.append(p)

          if not targets:
              print('::error::플레이스홀더 __GEMINI_API_KEY__ 를 가진 파일이 없습니다. js/api-config.js 가 저장소에 있는지 확인하세요.')
              sys.exit(1)

          print('주입 완료 파일:')
          for t in targets:
              print(' -', t)
          PY

      - name: 잔여 플레이스홀더 검증
        run: |
          if grep -rl "__GEMINI_API_KEY__" --include="*.js" --include="*.html" . ; then
            echo "::error::치환되지 않은 플레이스홀더가 남아 있습니다."
            exit 1
          fi
          echo "검증 통과 · 잔여 플레이스홀더 없음"

      - name: Jekyll 비활성화(.nojekyll)
        run: touch .nojekyll

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
